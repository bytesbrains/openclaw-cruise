# ClawHub package publish — official reusable workflow from openclaw/clawhub.
#
# - pull_request → dry-run validate only
# - push tags v* → real publish
# - workflow_dispatch → dry_run input (default true)
#
# One-time setup before the first tag:
#   1. Claim/create @bytesbrains on https://clawhub.ai (matches package scope).
#   2. clawhub login && clawhub package publish . --dry-run --owner bytesbrains
#   3. Repo secret CLAWHUB_TOKEN
#   4. Drop package.json "private": true, bump version, tag vX.Y.Z on main
name: clawhub-publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (no publish)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: clawhub-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: true
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.event.pull_request.head.sha }}
      source_ref: ${{ github.head_ref }}

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: false
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-dispatch:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: ${{ inputs.dry_run }}
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
