# ClawHub package publish — official reusable workflow from openclaw/clawhub.
#
# - pull_request → dry-run validate only (defaults to caller merge commit)
# - push tags v* → real publish
# - workflow_dispatch → dry_run input (default true)
#
# One-time setup before the first tag:
#   1. Claim/create @bytesbrains on https://clawhub.ai (matches package scope).
#   2. clawhub login && clawhub package publish . --dry-run --owner bytesbrains
#   3. Repo secret CLAWHUB_PUBLISH_TOKEN (from local .env / clawhub.ai)
#   4. Bump version, tag vX.Y.Z on main
#
# Pin is the peeled commit for tag v0.23.3 (not a movable tag).
name: clawhub-publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (no publish)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

# Share the lock with release.yml on the same ref so npm + Hub do not race;
# never cancel an in-flight real publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    # Callee requests contents+actions+id-token; caller must allow each.
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8 # v0.23.3
    with:
      dry_run: true
      owner: bytesbrains
      family: code-plugin
      # Omit source_* — defaults use github.repository + github.sha (PR merge
      # commit in the base repo). Hardcoding head.sha + base repo breaks forks.

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8 # v0.23.3
    with:
      dry_run: false
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_PUBLISH_TOKEN }}

  publish-dispatch:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8 # v0.23.3
    with:
      # inputs.dry_run is boolean; reusable workflow dry_run is type: boolean.
      dry_run: ${{ inputs.dry_run }}
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_PUBLISH_TOKEN }}
