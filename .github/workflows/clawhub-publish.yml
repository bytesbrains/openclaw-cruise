# ClawHub package publish — official reusable workflow from openclaw/clawhub.
#
# Tag push (v*) or workflow_dispatch with dry_run=false publishes.
# Pull requests only dry-run validate (no publish mutation).
#
# One-time setup:
#   1. Claim / create the @bytesbrains owner on https://clawhub.ai (scope must
#      match package.json name @bytesbrains/openclaw-cruise-provider).
#   2. clawhub login && clawhub package publish . --dry-run --owner bytesbrains
#   3. Add repo secret CLAWHUB_TOKEN (from clawhub.ai account / CLI token).
#   4. Drop "private": true, bump version, tag vX.Y.Z on main.
#
# After the first successful publish, optional trusted publishing:
#   clawhub package trusted-publisher set @bytesbrains/openclaw-cruise-provider \
#     --repository bytesbrains/openclaw-cruise \
#     --workflow-filename clawhub-publish.yml
name: clawhub-publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (no publish)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: clawhub-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: true
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.event.pull_request.head.sha }}
      source_ref: ${{ github.head_ref }}

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      owner: bytesbrains
      family: code-plugin
      source_repo: bytesbrains/openclaw-cruise
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
