# Tag-triggered publish only — a merge to main/dev is never a release.
#
# Cutting a release:
#   1. Bump package.json version on main (and CHANGELOG); drop "private": true.
#   2. Tag that commit: git tag v0.1.0 && git push origin v0.1.0
#   3. This workflow builds, packs, scans the tarball, then publishes to npm
#      (and ClawHub when CLAWHUB_TOKEN is set).
#
# workflow_dispatch defaults to dry_run=true (pack/validate only). Set dry_run
# to false on a v* tag ref to publish without pushing a new tag.
#
# Required secrets:
#   NPM_TOKEN     — npm automation token with publish rights for @bytesbrains
# Optional:
#   CLAWHUB_TOKEN — ClawHub CLI token for `clawhub package publish`
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Recipe check
        run: npm run check:recipe

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          if node -p 'require("./package.json").private === true'; then
            echo "package.json still has private:true — flip it before tagging a release"
            exit 1
          fi

      - name: Pack and assert no secrets in the artifact
        run: npm run pack:check

      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: dry_run — pack/validate only"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Mode: publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: not a v* tag — pack/validate only"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set — cannot publish"
            exit 1
          fi
          npm publish --access public --provenance

      - name: Publish to ClawHub from the scanned npm pack (optional)
        if: steps.gate.outputs.publish == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "CLAWHUB_TOKEN not set — skipping ClawHub publish (npm-only release)"
            exit 0
          fi
          npm install -g clawhub
          TARBALL="$(npm pack --silent | tail -n1)"
          case "$TARBALL" in
            *.tgz) ;;
            *) echo "unexpected pack output: $TARBALL"; exit 1 ;;
          esac
          # Basename only — refuse path components (defense in depth; npm pack is local).
          case "$TARBALL" in
            */*|*..*) echo "refusing unsafe tarball path: $TARBALL"; exit 1 ;;
          esac
          EXTRACT="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$EXTRACT"
          gitleaks detect --source "$EXTRACT/package" --no-git --redact --no-banner --config .gitleaks.toml
          clawhub package validate "$EXTRACT/package"
          clawhub package publish "$EXTRACT/package" --family code-plugin --owner bytesbrains
          rm -rf "$EXTRACT" "$TARBALL"
