# Tag-triggered publish only — a merge to main/dev is never a release.
#
# Cutting a release:
#   1. Bump package.json version (and CHANGELOG) in a PR into dev.
#   2. Merge a dev → main release PR.
#   3. Tag the main commit: git tag v0.1.0 && git push origin v0.1.0
#   4. This workflow builds, packs, scans the tarball, then publishes to npm
#      via OIDC trusted publishing. The tag must point at a commit on main.
#
# ClawHub is published by clawhub-publish.yml on the same tag — not here, so the
# two workflows never push the same version twice.
#
# workflow_dispatch defaults to dry_run=true (pack/validate only). Set dry_run
# to false on a v* tag ref to publish without pushing a new tag.
#
# npm: configure Trusted Publisher on npmjs for this repo + workflow filename
#   release.yml (no NPM_TOKEN). Optional break-glass: secrets.NPM_TOKEN.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag can be checked against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports OIDC trusted publishing
        # 11.5.1 is the documented minimum for npm OIDC trusted publishing.
        run: npm install -g npm@11.5.1

      - name: Install gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Recipe check
        run: npm run check:recipe

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          # Test the value, not node's exit code: `node -p` exits 0 on true and false.
          if node -e 'process.exit(require("./package.json").private === true ? 0 : 1)'; then
            echo "package.json still has private:true — flip it before tagging a release"
            exit 1
          fi

      - name: Assert tag points at a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Releases go feature → dev → main; a tag cut from dev or a feature branch
          # would publish code main never reviewed.
          # Fetch main explicitly rather than relying on checkout's refspec.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          # --is-ancestor exits 0 (on main), 1 (not on main), or >1 on a git error;
          # keep the error distinct so it is not reported as "not on main".
          rc=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main — merge the dev → main release PR, then tag main"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "Could not check $GITHUB_SHA against origin/main (git exit $rc)"
            exit "$rc"
          fi

      - name: Pack and assert no secrets in the artifact
        run: npm run pack:check

      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: dry_run — pack/validate only"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Mode: publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: not a v* tag — pack/validate only"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        env:
          # Prefer OIDC trusted publishing. Only set NODE_AUTH_TOKEN when the
          # optional break-glass NPM_TOKEN secret exists — an empty value blocks OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node may write an empty/placeholder _authToken; that blocks OIDC
          # and can race the break-glass env token. Strip only those empty forms —
          # never delete a real non-empty _authToken line (and leave registry/scope
          # lines such as the tracked legacy-peer-deps .npmrc alone).
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak -E \
                -e '/_authToken[[:space:]]*=[[:space:]]*$/d' \
                -e '/_authToken[[:space:]]*=[[:space:]]*\$\{NODE_AUTH_TOKEN\}[[:space:]]*$/d' \
                "$f" || true
              rm -f "$f.bak"
            fi
          done
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Using break-glass NPM_TOKEN"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "Using npm OIDC trusted publishing (no NPM_TOKEN)"
            unset NODE_AUTH_TOKEN || true
          fi
          # Trusted publishing attaches provenance automatically; --provenance
          # remains fine for the token fallback path.
          npm publish --access public --provenance
